<!DOCTYPE html>
<html lang="en">
<head>
<style>
    :root {
      --bg-base: #080B11;
      --bg-sidebar: rgba(13, 18, 30, 0.45);
      --border-glow: rgba(6, 182, 212, 0.15);
      --border-dim: rgba(255, 255, 255, 0.06);
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --brand-primary: #06B6D4;
      --brand-secondary: #3B82F6;
      --user-gradient: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
  }
  
  * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
  }
  
  body {
      background-color: var(--bg-base);
      background-image: 
          radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
  }
  
  /* =========================================================
     🖥️ DESKTOP / LANDSCAPE LAYOUT RULES
     ========================================================= */
  
  .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px; /* Fixed matching layout canvas */
      height: 100vh;
      background: var(--bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      z-index: 1000;
      transition: transform 0.3s ease-in-out;
  }
  
  .menu-toggle, .close-btn {
      color: white;
      display: none; /* Invisible on spacious desktop displays */
  }
  
  .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh; /* Dynamic layout wrapper track height */
      position: relative;
      background: transparent;
      margin-left: 280px; /* Offset smoothly past the sidebar */
      transition: margin-left 0.3s ease-in-out;
  }
  
  .chat-header {
      padding: 1.25rem 2.5rem;
      background: rgba(8, 11, 17, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
  }
  
  /* Content Stream Track Rules */
  .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 2.5rem 1rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      /* Safe padding offset preventing message clipping behind floating footer input box */
      padding-bottom: calc(120px + var(--keyboard-height, 0px)); 
  }
  
  .chat-feed::-webkit-scrollbar {
      width: 6px;
  }
  
  .chat-feed::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
  }
  
  /* Text Input Control System Design Layout */
  .chat-footer {
      position: fixed;
      bottom: 0;
      right: 0;
      width: calc(100% - 280px); /* Fill remaining space alongside desktop sidebar */
      padding: 1.5rem 2.5rem 2.5rem 2.5rem;
      background: linear-gradient(180deg, rgba(8, 11, 17, 0) 0%, var(--bg-base) 50%);
      display: flex;
      justify-content: center;
      z-index: 100;
      box-sizing: border-box;
      transition: width 0.3s ease-in-out, left 0.3s ease-in-out;
  }
  
  .input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(13, 18, 30, 0.7);
      border: 1px solid var(--border-dim);
      padding: 0.75rem 1.25rem;
      border-radius: 16px;
      width: 70%; /* Balanced width constraint for desktop monitor screens */
      max-width: 820px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      transition: bottom 0.1s ease-out;
  }
  
  /* Inner Text Area Box Element */
  .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
  }
  
  .chat-input::placeholder {
      color: var(--text-muted);
  }
  
  .send-btn {
      background: var(--brand-primary);
      color: #030712;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
  }
  
  .send-btn:hover {
      background: var(--brand-secondary);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
  }
  
  /* =========================================================
     📱 PORTRAIT MODE MEDIA QUERIES (Mobile Screen Sizing Fixes)
     ========================================================= */
  @media (orientation: portrait), (max-width: 768px) {
      .chat-container {
          margin-left: 0; /* Clear grid layout spacing block margins */
      }
  
      /* Roll back the Sidebar menu container off-screen */
      .sidebar {
          transform: translateX(-100%);
          background: rgba(8, 11, 17, 0.95); /* Slightly darker backing for clarity */
      }
  
      /* Class activated via JS to reveal sidebar on click */
      .sidebar.open {
          transform: translateX(0);
          box-shadow: 10px 0 30px rgba(0, 0, 0, 0.6);
      }
  
      /* Render structural interactive UI buttons */
      .menu-toggle {
          display: block;
          position: fixed;
          top: 15px;
          left: 15px;
          z-index: 999;
          font-size: 20px;
          background: rgba(13, 18, 30, 0.8);
          border: 1px solid var(--border-dim);
          color: var(--text-main);
          padding: 8px 12px;
          border-radius: 8px;
          cursor: pointer;
      }
  
      .close-btn {
          display: block;
          position: absolute;
          top: 20px;
          right: 20px;
          font-size: 20px;
          background: none;
          border: none;
          color: var(--text-muted);
          cursor: pointer;
      }
  
      .close-btn:hover {
          color: var(--text-main);
      }
  
      .chat-header {
          padding: 1.25rem 1.5rem 1.25rem 4.5rem; /* Leaves breathing room for menu hamburger link */
      }
  
      .chat-feed {
          padding: 1.5rem 1.5rem 1rem 1.5rem;
          /* Dynamic viewport padding adjustments track shifting virtual mobile keyboards safely */
          padding-bottom: calc(100px + var(--keyboard-height, 0px));
      }

<script type="text/javascript">
// Collect and isolate state management DOM target nodes
document.addEventListener('DOMContentLoaded', () => {
    const chatFeed = document.getElementById('chatFeed');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newThreadBtn = document.getElementById('newThreadBtn');
    const presetItems = document.querySelectorAll('[data-preset]');

    // Pin scroll window position values cleanly to footer boundaries
    function scrollToBottom() {
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    // Process and dispatch clear history buffer states
    function clearFeed() {
        chatFeed.innerHTML = `
            <div class="message-group">
                <div class="message-row bot">
                    <div class="avatar"><img src="https://i.postimg.cc/QxMcTw1c/1030fa6ff83f52a432278a00d03b7919274e68cf7d898bf5e02fe600428a73af-removebg-preview.png" width=34px>
</div>
                    <div class="message-bubble">Share your ideas with me</div>
                </div>
            </div>`;
        scrollToBottom();
    }

    // Inject preset text directly from side shortcuts
    function insertPreset(text) {
        userInput.value = text;
        sendMessage();
    }

    // Primary runtime payload dispatch loop logic
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Render user message bubble layout immediately
        appendMessage(text, 'user');
        userInput.value = '';
        setLoadingState(true);

        try {
            // Forward payload string elements tracking back to local Flask server route
          const response = await fetch("https://your-chatbot.onrender.com/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    message: "Hello"
  })
})
.then(response => response.json())
.then(data => console.log(data.reply));
            const data = await response.json();

            if (response.ok) {
                appendMessage(data.reply, 'bot', true);
            } else {
                appendMessage(`Error: ${data.message || 'Verification failure.'}`, 'bot');
            }
        } catch (err) {
            appendMessage("Connection problem.", "bot");
        } finally {
            setLoadingState(false);
        }
    }

    // Dynamic Element Builder Engine for message streams
    function appendMessage(text, sender, includeMeta = false) {
        const group = document.createElement('div');
        group.className = 'message-group';

        const avatarLabel = sender === 'user' ? '👤' : '<img src="https://i.postimg.cc/QxMcTw1c/1030fa6ff83f52a432278a00d03b7919274e68cf7d898bf5e02fe600428a73af-removebg-preview.png" height=34px width=34px>';
        
        // Construct standard structural content row
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;
        row.innerHTML = `
            <div class="avatar">${avatarLabel}</div>
            <div class="message-bubble"></div>
        `;
        // Use textContent securely to avoid malicious raw HTML script injections
        row.querySelector('.message-bubble').textContent = text;
        group.appendChild(row);

        // Append sub-action control nodes if requested
        if (includeMeta) {
            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            
            const copyBtn = document.createElement('span');
            copyBtn.className = 'meta-action';
            copyBtn.textContent = 'Copy';
            copyBtn.addEventListener('click', () => navigator.clipboard.writeText(text));

            const reuseBtn = document.createElement('span');
            reuseBtn.className = 'meta-action';
            reuseBtn.textContent = 'Reuse';
            reuseBtn.addEventListener('click', () => insertPreset(text));

            meta.appendChild(copyBtn);
            meta.appendChild(reuseBtn);
            group.appendChild(meta);
        }
        
        chatFeed.appendChild(group);
        scrollToBottom();
    }

    // Toggle interactive focus variables during network transmission
    function setLoadingState(isLoading) {
        if (isLoading) {
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            const loader = document.createElement('div');
            loader.id = 'activeLoader';
            loader.className = 'message-row bot';
            loader.innerHTML = `
                <div class="avatar"><img src="https://i.postimg.cc/QxMcTw1c/1030fa6ff83f52a432278a00d03b7919274e68cf7d898bf5e02fe600428a73af-removebg-preview.png" height=34px width=34px></div>
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatFeed.appendChild(loader);
        } else {
            userInput.disabled = false;
            sendBtn.disabled = false;
            const loader = document.getElementById('activeLoader');
            if (loader) loader.remove();
            userInput.focus();
        }
        scrollToBottom();
    }

    // Clean Event Listener Triggers
    sendBtn.addEventListener('click', sendMessage);
    newThreadBtn.addEventListener('click', clearFeed);
    
    userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    presetItems.forEach(item => {
        item.addEventListener('click', () => {
            const command = item.getAttribute('data-preset');
            insertPreset(command);
        });
    });
});

</script>

<script type="text/javascript">
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    // Calculate how much space the keyboard is occupying
    const keyboardHeight = window.innerHeight - window.visualViewport.height;
    
    // Set the CSS variable dynamically
    document.documentElement.style.setProperty(
      '--keyboard-height', 
      `${Math.max(0, keyboardHeight)}px`
    );
    
    // Auto-scroll to the latest message so the user sees the newest text
    const chatHistory = document.querySelector('.message-row');
    if (chatHistory) {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    } 
  });
}

</script>
<script type="text/javascript">
    const chatInput = document.getElementById('userInput');
    const chatFeed = document.getElementById('chatFeed');
    const chatFooter = document.querySelector('.chat-footer');

    // 1. Force the viewport to scroll directly to the input field on activation focus
    chatInput.addEventListener('focus', () => {
        setTimeout(() => {
            chatInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (chatFeed) {
                chatFeed.scrollTop = chatFeed.scrollHeight;
            }
        }, 300); // 300ms pause accommodates native OS drawer animations safely
    });

    // 2. Absolute Visual Viewport Controller
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            const viewportHeight = window.visualViewport.height;
            const windowHeight = window.innerHeight;
            const keyboardHeight = windowHeight - viewportHeight;

            if (keyboardHeight > 0) {
                // When keyboard is active, shift the container up matching the layout block clearance
                chatFooter.style.bottom = `${keyboardHeight}px`;
                chatFooter.style.position = 'fixed';
            } else {
                // Reset styling positions when the virtual keyboard is dismissed
                chatFooter.style.bottom = '0px';
                chatFooter.style.position = 'absolute';
            }

            // Keep the chat feed snapped to the latest message entry block
            if (chatFeed) {
                chatFeed.scrollTop = chatFeed.scrollHeight;
            }
        });
    }
</script>

</body>
</html>
