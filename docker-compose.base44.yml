services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    env_file:
      - /run/base44/app.env
    command: >
      sh -c "pip install -q -r requirements.txt &&
             flask run --host=0.0.0.0 --port=5000 --reload"
